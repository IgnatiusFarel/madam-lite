name: Build and Deploy Madam Lite BE

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/kodegiri/madam-lite-be:latest .

      - name: Push Docker image to GitHub Container Registry
        run: docker push ghcr.io/kodegiri/madam-lite-be:latest

  deploy-to-digitalocean:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: SSH into DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }} #ed25519
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose -f madam-lite/madam-lite-be-compose.yaml pull
            docker-compose -f madam-lite/madam-lite-be-compose.yaml down
            docker-compose -f madam-lite/madam-lite-be-compose.yaml up -d
            docker image prune -f
            

